<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TARS - 1st Year Induction & Recruitment Form</title>
  <style>
    :root {
      --primary: #00e5ff;
      --primary-dark: #00b0ff;
      --bg: #0b0f19;
      --card-bg: rgba(22, 27, 46, 0.95);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --accent: #38bdf8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #172554, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 229, 255, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .header {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(14, 165, 233, 0.2));
      border-bottom: 1px solid var(--border);
      padding: 28px 24px;
      text-align: center;
    }

    .header .badge {
      display: inline-block;
      background: rgba(0, 229, 255, 0.15);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .header h1 {
      font-size: 1.8rem;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    form {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    label span.req {
      color: #f43f5e;
    }

    input, select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2);
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .radio-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .radio-card:hover {
      border-color: var(--primary);
      background: rgba(0, 229, 255, 0.05);
    }

    .radio-card input[type="radio"] {
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
    }

    button.btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #041226;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 10px;
    }

    button.btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
    }

    .table-container {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding: 20px 24px;
      background: #080d1a;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .table-header h3 {
      font-size: 1rem;
      color: #fff;
    }

    .btn-export {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-export:hover {
      background: #059669;
    }

    .table-wrapper {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #1e293b;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
    }

    th {
      background: #0f172a;
      color: var(--text-muted);
      position: sticky;
      top: 0;
    }

    .success-banner {
      display: none;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">TARS Recruitment 2026</span>
      <h1>TARS Induction Form</h1>
      <p>The Automation & Robotics Society — 1st Year Registration</p>
    </div>

    <form id="inductionForm">
      <div id="successMsg" class="success-banner">
        Response submitted successfully! It has been recorded in the responses table below.
      </div>

      <div class="form-group">
        <label for="name">Full Name <span class="req">*</span></label>
        <input type="text" id="name" required placeholder="e.g. John Doe" />
      </div>

      <div class="form-group">
        <label for="studentId">Student ID / Roll No. <span class="req">*</span></label>
        <input type="text" id="studentId" required placeholder="e.g. 26BCE1024" />
      </div>

      <div class="form-group">
        <label for="branch">Branch <span class="req">*</span></label>
        <select id="branch" required>
          <option value="" disabled selected>Select your branch</option>
          <option value="Computer Science & Engineering (CSE)">Computer Science & Engineering (CSE)</option>
          <option value="Information Technology (IT)">Information Technology (IT)</option>
          <option value="Electronics & Communication (ECE)">Electronics & Communication (ECE)</option>
          <option value="Electrical Engineering (EE)">Electrical Engineering (EE)</option>
          <option value="Mechanical Engineering (ME)">Mechanical Engineering (ME)</option>
          <option value="Civil Engineering (CE)">Civil Engineering (CE)</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phone">Phone / WhatsApp Number <span class="req">*</span></label>
        <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="10-digit mobile number (e.g. 9876543210)" />
      </div>

      <div class="form-group">
        <label>Preferred Domain <span class="req">*</span></label>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="domain" value="Technical" required />
            <span>Technical</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="domain" value="PR and Marketing" />
            <span>PR and Marketing</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="domain" value="Sponsorship" />
            <span>Sponsorship</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="domain" value="Design and Graphics" />
            <span>Design and Graphics</span>
          </label>
          <label class="radio-card">
            <input type="radio" name="domain" value="Research and Content" />
            <span>Research and Content</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Application</button>
    </form>

    <div class="table-container">
      <div class="table-header">
        <h3>Saved Responses (<span id="responseCount">0</span>)</h3>
        <button id="exportBtn" class="btn-export">Download as Excel/CSV</button>
      </div>
      <div class="table-wrapper">
        <table id="responsesTable">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Name</th>
              <th>ID</th>
              <th>Branch</th>
              <th>Phone</th>
              <th>Domain</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" style="text-align:center; color:#64748b; padding:20px;">No responses recorded yet</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('inductionForm');
    const tableBody = document.getElementById('tableBody');
    const countDisplay = document.getElementById('responseCount');
    const successMsg = document.getElementById('successMsg');
    const exportBtn = document.getElementById('exportBtn');

    // Load responses from LocalStorage
    let responses = JSON.parse(localStorage.getItem('tars_responses') || '[]');

    function renderTable() {
      countDisplay.innerText = responses.length;
      if (responses.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b; padding:20px;">No responses recorded yet</td></tr>`;
        return;
      }

      tableBody.innerHTML = responses.map(r => `
        <tr>
          <td>${r.timestamp}</td>
          <td>${r.name}</td>
          <td>${r.id}</td>
          <td>${r.branch}</td>
          <td>${r.phone}</td>
          <td><strong style="color:#00e5ff">${r.domain}</strong></td>
        </tr>
      `).join('');
    }

    renderTable();

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const newResponse = {
        timestamp: new Date().toLocaleString(),
        name: document.getElementById('name').value.trim(),
        id: document.getElementById('studentId').value.trim(),
        branch: document.getElementById('branch').value,
        phone: document.getElementById('phone').value.trim(),
        domain: document.querySelector('input[name="domain"]:checked').value
      };

      responses.push(newResponse);
      localStorage.setItem('tars_responses', JSON.stringify(responses));
      renderTable();

      // Reset form & show notification
      form.reset();
      successMsg.style.display = 'block';
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 4000);
    });

    // CSV Export
    exportBtn.addEventListener('click', () => {
      if (responses.length === 0) {
        alert('No responses to export yet!');
        return;
      }

      const headers = ['Timestamp', 'Full Name', 'Student ID', 'Branch', 'Phone Number', 'Domain'];
      const rows = responses.map(r => [
        `"${r.timestamp}"`,
        `"${r.name}"`,
        `"${r.id}"`,
        `"${r.branch}"`,
        `"${r.phone}"`,
        `"${r.domain}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', 'TARS_1st_Year_Responses.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
